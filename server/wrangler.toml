name = "game-101"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# the room tables are cut out of ../www/index.html before every deploy (see build-engine.mjs)
[build]
command = "node build-engine.mjs"

[[d1_databases]]
binding = "DB"
database_name = "game101"
database_id = "da633406-9717-4568-8f68-d502b16dc620"

# Secrets (set with "wrangler secret put", never written here):
#   TG_TOKEN  the Telegram bot token
#   TG_HOOK   the secret Telegram sends with every update

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

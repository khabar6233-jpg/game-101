<!doctype html>
<!-- The Yandex Games cover, 800x470 (rendered to PNG by a headless browser from the unpacked archive folder) -->
<html><head><meta charset="utf-8"><style>

  body::before { content: ''; position: absolute; inset: 0; opacity: .14;

  .title { position: absolute; left: 56px; top: 92px; color: #fff; font-weight: 900; font-size: 210px; line-height: 1; letter-spacing: -6px;

  .suits { position: absolute; left: 66px; top: 330px; display: flex; gap: 18px; font-size: 44px; }
  .suits span { width: 64px; height: 64px; border-radius: 16px; background: #fbfaf4; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0,0,0,.35); }

  .fan img { position: absolute; left: 120px; top: 30px; width: 170px; border-radius: 12px; box-shadow: 0 10px 26px rgba(0,0,0,.45); transform-origin: 50% 120%; background: #fff; }

  <div class="title">1<i>0</i>1</div>

</body></html>
